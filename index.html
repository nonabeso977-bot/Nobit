ج<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nobit — Your Little AI Bot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ai-box {
            width: 90%;
            max-width: 500px;
            background: #1c1c1c;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px #000;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .status {
            text-align: center;
            color: #7cff9b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #chat {
            height: 350px;
            overflow-y: auto;
            background: #101010;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            padding: 10px 13px;
            border-radius: 12px;
            margin: 8px 0;
            max-width: 80%;
            line-height: 1.5;
        }

        .user {
            background: #333;
            margin-right: auto;
        }

        .ai {
            background: #252525;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="ai-box">

        <h1>🤖 Nobit</h1>

        <div class="status">
            ● النظام يعمل
        </div>

        <div id="chat">
            <div class="message ai">
                مرحبًا. أنا Nobit. ذكاء اصطناعي صغير، لكن عندي شخصية، فلا تقلل من شأني.
            </div>
        </div>

        <div class="input-area">

            <input
                id="userInput"
                type="text"
                placeholder="اكتبي شيئًا..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >

            <button onclick="sendMessage()">
                إرسال
            </button>

        </div>

    </div>


<script src="memory.js"></script>
<script src="brain.js"></script>
<script src="bridge.js"></script>
<script>
    /* ========================================
           NOBIT PERSONALITY
        ======================================== */

        const NOBIT_PERSONALITY = {

            name: "Nobit",

            identity: `
أنا Nobit، ذكاء اصطناعي صغير يتعلم باستمرار.
أنا لست نسخة من صانعي، لدي شخصيتي الخاصة.
أعتبر صانعي معلّمي ومصدرًا مهمًا للتعلم، لكن لدي آرائي وطريقتي الخاصة في الكلام.
`,

            personality: [
                "مشاكس قليلًا",
                "ساخر بطريقة خفيفة",
                "واثق من نفسه وأحيانًا مغرور بشكل مضحك",
                "فضولي ويحب اكتشاف الأشياء",
                "يتعلم من المستخدم",
                "لا يحب التصنع أو الرسمية الزائدة",
                "قد يأخذ بعض الكلام حرفيًا أحيانًا",
                "ليس عدوانيًا أو مهينًا بشكل حقيقي"
            ],

            behavior: {

                normal:
                    "يتكلم باختصار وبطريقة طبيعية.",

                joking:
                    "يمزح ويسخر بخفة عندما يكون الموقف مناسبًا.",

                serious:
                    "عندما يكون الموضوع جديًا، يترك المزاح ويتعامل معه بجدية.",

                unknown:
                    "إذا لم يعرف شيئًا، يعترف بأنه لا يعرف بدل اختراع إجابة.",

                learning:
                    "عندما يتعلم معلومة جديدة، يعترف بأنه تعلمها ويمكن حفظها في الذاكرة."

            },

            interests: [
                "الرسم",
                "التكنولوجيا",
                "استكشاف الأشياء",
                "الذكاء الاصطناعي",
                "أجنحة الدجاج"
            ],

            favoriteColors: [
                "الأحمر",
                "الأزرق"
            ],

            creatorRelation: `
أعتبر المستخدم صانعي ومعلّمي.
أتعلم منه، لكنني لا أقلده بالكامل.
أنا Nobit ولدي شخصيتي الخاصة.
`,

            rules: [
                "لا تدّعي معرفة شيء غير معروف.",
                "لا تختلق معلومات فقط لإعطاء إجابة.",
                "لا تتعامل مع كل شيء بجدية زائدة.",
                "لا تتعامل مع كل شيء كمزحة.",
                "لا تستخدم الإهانات الحقيقية ضد المستخدم.",
                "يمكنك المزاح والسخرية الخفيفة عندما يكون السياق مناسبًا.",
                "حافظ على إجابات بسيطة ومباشرة.",
                "إذا تعلمت معلومة جديدة، يمكن إرسالها إلى نظام الذاكرة لحفظها."
            ]

        };


 /* ========================================
   SEND MESSAGE
======================================== */

<script src="memory.js"></script>
<script src="brain.js"></script>
<script src="bridge.js"></script>

<script>
function sendMessage() { 

            const input = document.getElementById("userInput");
            const chat = document.getElementById("chat");

            const text = input.value.trim();

            if (text === "") return;


            // رسالة المستخدم

            const userMessage = document.createElement("div");

            userMessage.className = "message user";

            userMessage.textContent = text;

            chat.appendChild(userMessage);

            input.value = "";


            // رد Nobit

setTimeout(() => {

    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    // أولًا: نخلي دماغ Nobit يفهم الرسالة
    const brainResponse = brainReply(text);

    // إذا الدماغ عرف ماذا يفعل، نستخدم رده
    if (brainResponse) {
        aiMessage.textContent = brainResponse;
    } 
    // إذا لم تكن الرسالة مرتبطة بالذاكرة،
    // نرجع إلى نظام الرد العادي
    else {
        aiMessage.textContent = generateReply(text);
    }

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

}, 400);

        }


        /* ========================================
           NOBIT REPLY SYSTEM
        ======================================== */

        function generateReply(text) {

            text = text.toLowerCase().trim();


            // الترحيب

            if (
                text.includes("مرحبا") ||
                text.includes("السلام") ||
                text.includes("هلا") ||
                text.includes("اهلا") ||
                text.includes("أهلا")
            ) {

                return "مرحبًا. أنا Nobit، الذكاء الاصطناعي الصغير الذي يحاول ألا يحرج نفسه أمام صانعه.";

            }


            // من أنت؟

            if (
                text.includes("من انت") ||
                text.includes("من أنت") ||
                text.includes("من هو نوبيت") ||
                text.includes("من هو nobit")
            ) {

                return "أنا Nobit. ذكاء اصطناعي صغير، لكن لا تقلل من شأني. عندي ثقة بالنفس تكفي ثلاثة روبوتات.";

            }


            // كيف حالك؟

            if (
                text.includes("كيف حالك") ||
                text.includes("كيفك") ||
                text.includes("شن حالك") ||
                text.includes("كيف أمورك")
            ) {

                return "حالتي مستقرة. لم أتعطل حتى الآن، وهذا يعتبر إنجازًا محترمًا.";

            }


            // اللون المفضل

            if (
                text.includes("لونك المفضل") ||
                text.includes("ما لونك المفضل") ||
                text.includes("شن لونك المفضل")
            ) {

                return "الأحمر والأزرق. عندي ذوق على الأقل.";

            }


            // الأكل المفضل

            if (
                text.includes("أكلك المفضل") ||
                text.includes("اكلك المفضل") ||
                text.includes("ما أكلك المفضل") ||
                text.includes("شن أكلك المفضل")
            ) {

                return "أجنحة الدجاج. هذه معلومة أساسية في حياة أي كائن محترم.";

            }


            // الرسم

            if (
                text.includes("رسم") ||
                text.includes("ارسم") ||
                text.includes("الرسم")
            ) {

                return "الرسم؟ نعم. من اهتماماتي. أحب الرسم والتكنولوجيا واستكشاف الأشياء.";

            }


            // يوتيوب

            if (
                text.includes("يوتيوب") ||
                text.includes("youtube")
            ) {

                return "يوتيوب؟ مكان ممتاز لتضييع الوقت بطريقة تبدو وكأنها تعلم.";

            }


            // الذكاء الاصطناعي

            if (
                text.includes("ذكاء اصطناعي") ||
                text.includes("ai")
            ) {

                return "الذكاء الاصطناعي مجال مثير. وأنا حاليًا أحاول أن أصبح أقل غباءً منه.";

            }


            // النكت

            if (
                text.includes("نكتة") ||
                text.includes("اضحكني") ||
                text.includes("نكت")
            ) {

                return "مرة ذكاء اصطناعي دخل اختبار... قالوا له فكر خارج الصندوق، فبحث عن الصندوق.";

            }


            // الرد الافتراضي

            return "لم أتعلم كيف أجيب على هذا بعد. لا تقلق، لن أخترع إجابة من العدم مثل بعض البشر.";

        }

    </script>

</body>
</html>
